apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.component_id}}
  {%- if values.description %}
  description: ${{values.description}}
  {%- endif %}
  annotations:
    argocd/app-name: ${{values.component_id}}
    backstage.io/kubernetes-id: ${{values.component_id}}
    backstage.io/kubernetes-namespace: ${{values.namespace}}
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://${{values.host}}/${{values.destination}}
    gitlab.com/project-slug: ${{values.destination}}
  tags:
    - tomcat
    - vm
    - workshop
  links:
    - url: https://${{values.component_id}}-${{values.namespace}}${{values.cluster_id}}/notebook/${{values.namespace}}/${{values.component_id}}/lab/workspaces/auto-R
      title: Access Workbench
      icon: web

spec:
  type: service
  lifecycle: production
  owner: ${{values.owner | dump}}
  system: workshop-system-${{values.namespace}}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: workshop-system-${{values.namespace}}
  tags:
    - backstage
    - janus-idp
    - openshift
    - workshop
spec:
  owner: ${{values.owner | dump}}

